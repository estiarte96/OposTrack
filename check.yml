name: Comprovacio Diaria Oposicions
on:
  schedule:
    # S'executa cada dia a les 07:00 UTC (09:00 hora catalana)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permet provar-lo manualment quan vulguis

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar repositori
        uses: actions/checkout@v4

      - name: Configurar entorn Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar llibreries
        run: pip install requests beautifulsoup4

      - name: Executar rastrejador
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker_emergencies.py

      - name: Desar l'historial d'ofertes vistes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add vist_opos.json || true
          git commit -m "Auto: actualització convocatòries vistes" || true
          git push || true
